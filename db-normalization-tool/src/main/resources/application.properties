spring.application.name=db-normalization-tool

# Server port
server.port=8080

# Jackson - serialize enum và Set theo thứ tự
spring.jackson.serialization.order-map-entries-by-keys=true

# Tat auto-config JPA/Hibernate de tranh conflict voi ObjectDB
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Log level
logging.level.com.doan10=INFO
logging.level.org.springframework.web=DEBUG
